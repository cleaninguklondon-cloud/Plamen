# Mirrors main to cleaninguklondon-cloud/Plamen when PLAMEN_GITHUB_TOKEN is set.
# Add secret: sparkle-booking repo → Settings → Secrets → PLAMEN_GITHUB_TOKEN
# (PAT from cleaninguklondon-cloud with repo scope on Plamen)

name: Sync to Plamen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to Plamen
        env:
          PLAMEN_GITHUB_TOKEN: ${{ secrets.PLAMEN_GITHUB_TOKEN }}
        run: |
          if [ -z "$PLAMEN_GITHUB_TOKEN" ]; then
            echo "Skip: PLAMEN_GITHUB_TOKEN not configured in repository secrets."
            exit 0
          fi
          git remote add plamen "https://x-access-token:${PLAMEN_GITHUB_TOKEN}@github.com/cleaninguklondon-cloud/Plamen.git"
          git push plamen HEAD:main
